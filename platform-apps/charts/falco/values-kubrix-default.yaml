falco:
  scc:
    create: false
  tty: true
  falcoctl:
    image:
      tag: "0.14.2"

  driver:
    enabled: true
    #kind: ebpf
    kind: modern-bpf
    kubernetes:
      enabled: true

  falco:
    grpc:
      enabled: true
      bind_address: "unix:///run/falco/falco.sock"
    # when threadiness is 0, Falco automatically guesses it depending on the number of online cores
      threadiness: 0
    grpc_output:
      enabled: true

  falcosidekick:
    enabled: true
    image:
      tag: 2.35.0
    webui:
      enabled: true
      image:
        tag: 2.3.1
      replicaCount: 1
      user: ""
      existingSecret: "falco-ui-creds"
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: default-issuer
          external-dns.alpha.kubernetes.io/ttl: "60"
        ingressClassName: nginx
        hosts: []
        tls: []
    replicaCount: 1
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: true
    config:
      loki:
        hostport: "http://sx-loki.loki.svc.cluster.local:3100"
        grafanaDashboard:
          configMap:
            folder: "kubriX"
            folderAnnotation: grafana_folder

falco-exporter:
  image:
    tag: "0.8.7"
  falco:
    grpcUnixSocketPath: "unix:///run/falco/falco.sock"
    grpcTimeout: 3m

  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
    namespace: falco
    folder: "kubriX"
    folderAnnotation: grafana_folder

  prometheusRules:
    enabled: true

k8s-metacollector:
  serviceMonitor:
    create: true
  grafana:
    dashboards:
      enabled: true
      configMaps:
        collector:
          name: k8s-metacollector-grafana-dashboard
          namespace: falco
          folder: "kubriX"
          folderAnnotation: grafana_folder
