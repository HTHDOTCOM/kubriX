falco:
  scc:
    create: false
  tty: true
  falcoctl:
    image:
      tag: "0.14.2"

  driver:
    enabled: true
    #kind: ebpf
    kind: modern-bpf

  falco:
    # when threadiness is 0, Falco automatically guesses it depending on the number of online cores
    threadiness: 0

  # Native Prometheus metrics (replaces the retired falco-exporter gRPC sidecar).
  # Falco 0.44+ removed gRPC; metrics are now exposed on the falco-metrics service.
  metrics:
    enabled: true
  serviceMonitor:
    create: true
    # Propagate the falco-metrics Service's `type` label to targets so the
    # FalcoAbsent alert can distinguish falco from the k8s-metacollector
    # ServiceMonitor, which shares the same job label (the release name).
    targetLabels:
      - type

  # Bundled dashboard for the native metrics (replaces the falco-exporter dashboard).
  grafana:
    dashboards:
      enabled: true
      configMaps:
        falco:
          name: falco-grafana-dashboard
          namespace: falco
          folder: "kubriX"
          folderAnnotation: grafana_folder

  falcosidekick:
    enabled: true
    image:
      tag: 2.35.0
    webui:
      enabled: true
      image:
        tag: 2.3.1
      replicaCount: 1
      user: ""
      existingSecret: "falco-ui-creds"
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: default-issuer
          external-dns.alpha.kubernetes.io/ttl: "60"
        ingressClassName: nginx
        hosts: []
        tls: []
    replicaCount: 1
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: true
    config:
      loki:
        hostport: "http://sx-loki.loki.svc.cluster.local:3100"
        grafanaDashboard:
          configMap:
            folder: "kubriX"
            folderAnnotation: grafana_folder

k8s-metacollector:
  serviceMonitor:
    create: true
  grafana:
    dashboards:
      enabled: true
      configMaps:
        collector:
          name: k8s-metacollector-grafana-dashboard
          namespace: falco
          folder: "kubriX"
          folderAnnotation: grafana_folder
